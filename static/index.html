<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365D VWAP Scanner</title>
<style>
:root{--ink:#10233b;--muted:#63758b;--paper:#f3f7fb;--panel:#fff;--line:#d8e2ec;--cyan:#007f91;--cyan-soft:#dff4f6;--coral:#c84e65;--coral-soft:#fde9ed;--violet:#6558c7;--shadow:0 18px 50px rgba(29,60,89,.10)}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 "Segoe UI Variable","Segoe UI",sans-serif} button,input,select{font:inherit;color:inherit} button{cursor:pointer}
.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.topbar{background:#eaf1f8;border-bottom:1px solid var(--line);padding:22px clamp(16px,3vw,42px) 18px;display:flex;justify-content:space-between;gap:24px;align-items:end}.brand{display:flex;gap:14px;align-items:center}.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--violet));position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}.mark:after{content:"";position:absolute;left:9px;right:9px;top:18px;height:2px;background:white;box-shadow:-5px -7px 0 -0.5px white,6px 7px 0 -0.5px white;transform:rotate(-13deg)}h1{font:650 clamp(21px,2.5vw,30px)/1.05 "Segoe UI Variable Display","Segoe UI",sans-serif;letter-spacing:-.03em;margin:0}.sub{color:var(--muted);margin-top:5px;font-size:12px}.meta{text-align:right;font:600 11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.workspace{padding:20px clamp(12px,2.4vw,34px) 32px;display:grid;grid-template-columns:minmax(540px,1.15fr) minmax(390px,.85fr);gap:18px;min-height:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-width:0}.scanner{display:flex;flex-direction:column;min-height:680px}.controls{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap;align-items:center}.search{flex:1;min-width:170px;border:1px solid var(--line);background:#f8fafc;border-radius:10px;padding:9px 11px;outline:none}.search:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(101,88,199,.12)}.seg{display:flex;background:#edf2f7;padding:3px;border-radius:10px}.seg button{border:0;background:transparent;padding:7px 11px;border-radius:8px;font-size:12px;font-weight:650}.seg button.active{background:white;box-shadow:0 1px 4px rgba(16,35,59,.13)}.count{font:600 11px ui-monospace,monospace;color:var(--muted);margin-left:auto}
.table-wrap{overflow:auto;max-height:calc(100vh - 190px)}table{width:100%;border-collapse:separate;border-spacing:0}th{position:sticky;top:0;z-index:2;background:#f8fafc;border-bottom:1px solid var(--line);padding:10px 12px;text-align:right;color:var(--muted);font:650 10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}th:first-child{text-align:left}th button{all:unset;cursor:pointer}td{padding:11px 12px;border-bottom:1px solid #edf2f6;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}td:first-child{text-align:left}tbody tr{cursor:pointer;transition:background .12s}tbody tr:hover{background:#f5f8fc}tbody tr.selected{background:#edf1ff;box-shadow:inset 3px 0 var(--violet)}.symbol{font-weight:750;letter-spacing:.01em}.quote{font-size:10px;color:var(--muted);font-weight:600}.badge{display:inline-flex;min-width:66px;justify-content:center;border-radius:99px;padding:4px 8px;font:700 10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.05em}.above{background:var(--cyan-soft);color:#046976}.below{background:var(--coral-soft);color:#a83d53}.insufficient,.unavailable{background:#edf1f5;color:#718096}.positive{color:var(--cyan);font-weight:700}.negative{color:var(--coral);font-weight:700}
.detail{padding:20px;display:flex;flex-direction:column;min-height:680px;position:sticky;top:20px;align-self:start}.detail-head{display:flex;justify-content:space-between;gap:16px;align-items:start}.eyebrow{font:700 10px ui-monospace,monospace;color:var(--violet);letter-spacing:.09em;text-transform:uppercase}.ticker{font:700 clamp(28px,4vw,44px)/1 "Segoe UI Variable Display","Segoe UI",sans-serif;letter-spacing:-.045em;margin:5px 0}.price{font:650 18px ui-monospace,monospace}.distance{font:700 13px ui-monospace,monospace;padding-top:5px}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{background:#f7f9fc;border:1px solid #e6edf4;border-radius:12px;padding:11px}.stat label{display:block;color:var(--muted);font:650 9px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.06em}.stat strong{display:block;margin-top:5px;font:650 13px ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis}.chart-shell{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fbfdff}.chart-top{display:flex;justify-content:space-between;color:var(--muted);font:600 10px ui-monospace,monospace;padding:2px 3px 8px}.legend{display:flex;gap:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.chart{height:350px;width:100%;display:block}.empty{height:350px;display:grid;place-items:center;color:var(--muted);text-align:center;padding:30px}.note{margin-top:13px;color:var(--muted);font-size:11px;line-height:1.55}.loading{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:980px){.workspace{grid-template-columns:1fr}.detail{position:static;min-height:560px;order:-1}.scanner{min-height:600px}.table-wrap{max-height:620px}.topbar{align-items:start}.meta{display:none}}@media(max-width:600px){.topbar{padding:16px}.workspace{padding:10px}.detail{padding:15px;border-radius:14px}.panel{border-radius:14px}.stat-grid{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}.hide-mobile{display:none}.chart{height:280px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><div class="mark" aria-hidden="true"></div><div><h1>365D VWAP Scanner</h1><div class="sub">Binance USDT spot · rolling quote/base volume</div></div></div><div id="meta" class="meta">Loading market tape…</div></header>
<main class="workspace">
<section class="panel scanner">
<div class="controls"><input id="search" class="search" placeholder="Filter ticker…" aria-label="Filter ticker"><div class="seg" aria-label="VWAP side"><button data-filter="all" class="active">All</button><button data-filter="above">Above</button><button data-filter="below">Below</button><button data-filter="insufficient">No 365D</button></div><span id="count" class="count"></span></div>
<div class="table-wrap"><table><thead><tr><th><button data-sort="symbol">Ticker</button></th><th><button data-sort="price">Price</button></th><th class="hide-mobile"><button data-sort="vwap">365D VWAP</button></th><th><button data-sort="distance_pct">Distance</button></th><th><button data-sort="status">Side</button></th></tr></thead><tbody id="rows"><tr><td colspan="5" class="loading">Loading scanner…</td></tr></tbody></table></div>
</section>
<aside class="panel detail"><div id="detail"><div class="empty">Select a ticker to inspect its close against the rolling 365-day VWAP.</div></div></aside>
</main></div>
<script>
const state={rows:[],filter:'all',query:'',sort:'distance_pct',direction:-1,selected:null};
const $=s=>document.querySelector(s); const fmt=(n,d=4)=>n==null?'—':Intl.NumberFormat('en-US',{maximumFractionDigits:d,minimumFractionDigits:n<1?Math.min(d,2):0}).format(n);
function visible(){let r=state.rows.filter(x=>(state.filter==='all'||x.status===state.filter)&&x.symbol.includes(state.query));return r.sort((a,b)=>{let x=a[state.sort],y=b[state.sort];if(x==null)return 1;if(y==null)return-1;if(typeof x==='string')return x.localeCompare(y)*state.direction;return(x-y)*state.direction})}
function renderTable(){const list=visible();$('#count').textContent=`${list.length} / ${state.rows.length}`;$('#rows').innerHTML=list.map(x=>`<tr data-symbol="${x.symbol}" class="${x.symbol===state.selected?'selected':''}"><td><span class="symbol">${x.symbol.replace(/USDT$/,'')}</span><span class="quote"> / USDT</span></td><td>${fmt(x.price,8)}</td><td class="hide-mobile">${fmt(x.vwap,8)}</td><td class="${(x.distance_pct??0)>=0?'positive':'negative'}">${x.distance_pct==null?'—':(x.distance_pct>0?'+':'')+fmt(x.distance_pct,2)+'%'}</td><td><span class="badge ${x.status}">${x.status==='insufficient'?'No 365D':x.status}</span></td></tr>`).join('')||'<tr><td colspan="5" class="loading">No tickers match this view.</td></tr>';document.querySelectorAll('tbody tr[data-symbol]').forEach(el=>el.onclick=()=>select(el.dataset.symbol))}
function path(points,x,y){return points.map((p,i)=>(i?'L':'M')+x(p[0])+' '+y(p[1])).join(' ')}
function chartSvg(series){const good=series.filter(x=>x.close!=null), valid=good.filter(x=>x.vwap!=null);if(!valid.length)return '<div class="empty">This listing does not yet have 365 daily observations.</div>';const show=good.slice(-120),values=show.flatMap(x=>[x.close,x.vwap]).filter(x=>x!=null),lo=Math.min(...values),hi=Math.max(...values),pad=(hi-lo)*.08||1,min=lo-pad,max=hi+pad,w=720,h=350,L=58,R=12,T=16,B=30,x=i=>L+i*(w-L-R)/Math.max(1,show.length-1),y=v=>T+(max-v)*(h-T-B)/(max-min),ticks=[0,.25,.5,.75,1];let grid=ticks.map(t=>{const yy=T+t*(h-T-B),v=max-t*(max-min);return `<line x1="${L}" y1="${yy}" x2="${w-R}" y2="${yy}" stroke="#dde6ef"/><text x="${L-8}" y="${yy+4}" text-anchor="end" fill="#75879a" font-size="10">${fmt(v,6)}</text>`}).join('');let dates=[0,Math.floor((show.length-1)/2),show.length-1].map(i=>`<text x="${x(i)}" y="${h-7}" text-anchor="middle" fill="#75879a" font-size="10">${show[i].time.slice(5)}</text>`).join('');let cp=path(show.map((z,i)=>[i,z.close]),x,y),vp=path(show.map((z,i)=>[i,z.vwap]).filter(z=>z[1]!=null),x,y);return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Price and 365-day VWAP chart">${grid}${dates}<path d="${vp}" fill="none" stroke="#6558c7" stroke-width="2.5" vector-effect="non-scaling-stroke"/><path d="${cp}" fill="none" stroke="#007f91" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
async function select(symbol){state.selected=symbol;renderTable();const r=state.rows.find(x=>x.symbol===symbol);$('#detail').innerHTML='<div class="loading">Loading chart…</div>';try{const s=await fetch('/api/chart/'+symbol).then(x=>{if(!x.ok)throw Error(x.statusText);return x.json()});const cls=(r.distance_pct??0)>=0?'positive':'negative';$('#detail').innerHTML=`<div class="detail-head"><div><div class="eyebrow">Selected market</div><div class="ticker">${symbol.replace(/USDT$/,'')}<span class="quote"> / USDT</span></div><div class="price">${fmt(r.price,8)}</div></div><div class="distance ${cls}">${r.distance_pct==null?'No signal':(r.distance_pct>0?'+':'')+fmt(r.distance_pct,2)+'%'}<br><span class="badge ${r.status}">${r.status==='insufficient'?'No 365D':r.status}</span></div></div><div class="stat-grid"><div class="stat"><label>Latest close</label><strong>${fmt(r.price,8)}</strong></div><div class="stat"><label>365D VWAP</label><strong>${fmt(r.vwap,8)}</strong></div><div class="stat"><label>History</label><strong>${r.history_days||0} days</strong></div></div><div class="chart-shell"><div class="chart-top"><span>Last 120 daily closes</span><span class="legend"><span><i class="dot" style="background:#007f91"></i>Close</span><span><i class="dot" style="background:#6558c7"></i>365D VWAP</span></span></div>${chartSvg(s)}</div><div class="note">VWAP uses Binance-native daily volume with Velo overriding matching-scale recent rows, calculated as rolling dollar volume ÷ rolling coin volume. A full 365 daily observations is required before a signal is shown.</div>`}catch(e){$('#detail').innerHTML='<div class="empty">Chart unavailable: '+e.message+'</div>'}}
async function init(){try{const d=await fetch('/api/scanner').then(r=>{if(!r.ok)throw Error(r.statusText);return r.json()});state.rows=d.rows;const c=state.rows.reduce((a,x)=>(a[x.status]=(a[x.status]||0)+1,a),{});$('#meta').innerHTML=`${d.meta.symbols} markets · ${c.above||0} above · ${c.below||0} below<br>as of ${new Date(d.meta.generated_at).toLocaleString()}`;renderTable();const first=state.rows.find(x=>x.status==='above'||x.status==='below');if(first)select(first.symbol)}catch(e){$('#rows').innerHTML='<tr><td colspan="5" class="loading">Data unavailable. Run <b>python app.py --refresh</b>.</td></tr>';$('#meta').textContent='Scanner data unavailable'}}
$('#search').oninput=e=>{state.query=e.target.value.trim().toUpperCase();renderTable()};document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.filter=b.dataset.filter;renderTable()});document.querySelectorAll('th button').forEach(b=>b.onclick=()=>{if(state.sort===b.dataset.sort)state.direction*=-1;else{state.sort=b.dataset.sort;state.direction=b.dataset.sort==='symbol'?1:-1}renderTable()});init();
</script>
</body></html>

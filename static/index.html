<html lang="en">
<head>

<style>
:root{--ink:#10233b;--muted:#63758b;--paper:#f3f7fb;--panel:#fff;--line:#d8e2ec;--cyan:#007f91;--cyan-soft:#dff4f6;--coral:#c84e65;--coral-soft:#fde9ed;--violet:#6558c7;--amber:#b7791f;--amber-soft:#fff5d6;--shadow:0 18px 50px rgba(29,60,89,.10)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 "Segoe UI Variable","Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.topbar{background:#eaf1f8;border-bottom:1px solid var(--line);padding:18px clamp(16px,3vw,42px);display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{display:flex;gap:14px;align-items:center}.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--violet));position:relative}.mark:after{content:"";position:absolute;left:9px;right:9px;top:18px;height:2px;background:white;box-shadow:-5px -7px 0 -.5px white,6px 7px 0 -.5px white;transform:rotate(-13deg)}h1{font:650 clamp(21px,2.5vw,30px)/1.05 "Segoe UI Variable Display","Segoe UI",sans-serif;letter-spacing:-.03em;margin:0}.sub{color:var(--muted);margin-top:4px;font-size:12px}.feed{display:flex;gap:10px;align-items:center}.meta{text-align:right;font:600 10px/1.45 ui-monospace,Consolas,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.feed-dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 4px var(--cyan-soft)}.feed-dot.stale{background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}.feed-dot.error{background:var(--coral);box-shadow:0 0 0 4px var(--coral-soft)}.refresh{border:1px solid var(--line);background:white;border-radius:9px;padding:8px 10px;font-weight:700;font-size:11px}.refresh:disabled{opacity:.55;cursor:wait}
.workspace{padding:18px clamp(12px,2.4vw,34px) 30px;display:grid;grid-template-columns:minmax(600px,1.15fr) minmax(390px,.85fr);gap:18px;min-height:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-width:0}.scanner{display:flex;flex-direction:column;min-height:690px}.command{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap;align-items:center}.search{flex:1;min-width:165px;border:1px solid var(--line);background:#f8fafc;border-radius:10px;padding:9px 11px;outline:none}.search:focus,.seg button:focus-visible,.refresh:focus-visible,.star:focus-visible,.range button:focus-visible{outline:3px solid rgba(101,88,199,.2);outline-offset:1px}.seg{display:flex;background:#edf2f7;padding:3px;border-radius:10px}.seg button{border:0;background:transparent;padding:7px 10px;border-radius:8px;font-size:11px;font-weight:700;white-space:nowrap}.seg button.active{background:white;box-shadow:0 1px 4px rgba(16,35,59,.13);color:var(--violet)}.filter-row{padding:9px 14px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center;flex-wrap:wrap}.filter-label{font:700 9px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.select{border:1px solid var(--line);background:white;border-radius:8px;padding:6px 8px;font-size:11px}.favorite-filter{border:1px solid var(--line);background:white;border-radius:8px;padding:6px 9px;font-size:11px;font-weight:700}.favorite-filter.active{background:var(--amber-soft);border-color:#e9ca7a;color:#80570f}.count{font:600 11px ui-monospace,monospace;color:var(--muted);margin-left:auto}
.table-wrap{overflow:auto;max-height:calc(100vh - 238px)}table{width:100%;border-collapse:separate;border-spacing:0}th{position:sticky;top:0;z-index:2;background:#f8fafc;border-bottom:1px solid var(--line);padding:10px 9px;text-align:right;color:var(--muted);font:650 9px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}th:first-child{text-align:left;left:0;z-index:3}th button{all:unset;cursor:pointer}th.active-sort{background:#f0f0ff;color:var(--violet)}td{padding:9px;border-bottom:1px solid #edf2f6;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}td:first-child{text-align:left;position:sticky;left:0;background:white;z-index:1}tbody tr{cursor:pointer;transition:background .12s}tbody tr:hover,tbody tr:focus{background:#f5f8fc;outline:none}tbody tr:hover td:first-child,tbody tr:focus td:first-child{background:#f5f8fc}tbody tr.selected,tbody tr.selected td:first-child{background:#edf1ff}tbody tr.selected{box-shadow:inset 3px 0 var(--violet)}.market-cell{display:flex;align-items:center;gap:6px}.star{border:0;background:transparent;color:#aab5c1;padding:2px;font-size:15px;line-height:1}.star.on{color:#d69e2e}.symbol{font-weight:750}.quote{font-size:9px;color:var(--muted);font-weight:600}.badge{display:inline-flex;min-width:60px;justify-content:center;border-radius:99px;padding:4px 7px;font:700 9px ui-monospace,monospace;text-transform:uppercase}.above{background:var(--cyan-soft);color:#046976}.below{background:var(--coral-soft);color:#a83d53}.insufficient,.unavailable{background:#edf1f5;color:#718096}.positive{color:var(--cyan);font-weight:700}.negative{color:var(--coral);font-weight:700}.distance-cell{min-width:128px}.distance-row{display:flex;align-items:center;justify-content:flex-end;gap:8px}.rail{width:54px;height:12px;position:relative;background:linear-gradient(90deg,var(--coral-soft) 0 49%,#cbd5df 49% 51%,var(--cyan-soft) 51% 100%);border-radius:6px}.rail-dot{position:absolute;top:3px;width:6px;height:6px;border-radius:50%;transform:translateX(-50%);background:currentColor}.history{font:600 10px ui-monospace,monospace;color:var(--muted)}
.detail{padding:18px;display:flex;flex-direction:column;min-height:690px;position:sticky;top:18px;align-self:start}.detail-head{display:flex;justify-content:space-between;gap:14px;align-items:start}.eyebrow{font:700 9px ui-monospace,monospace;color:var(--violet);letter-spacing:.09em;text-transform:uppercase}.ticker{font:700 clamp(28px,4vw,43px)/1 "Segoe UI Variable Display","Segoe UI",sans-serif;letter-spacing:-.045em;margin:5px 0}.price{font:650 17px ui-monospace,monospace}.distance{font:700 13px ui-monospace,monospace;padding-top:5px;text-align:right}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.stat{background:#f7f9fc;border:1px solid #e6edf4;border-radius:11px;padding:10px}.stat label{display:block;color:var(--muted);font:650 8px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.06em}.stat strong{display:block;margin-top:5px;font:650 12px ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis}.chart-shell{border:1px solid var(--line);border-radius:14px;padding:9px;background:#fbfdff;position:relative}.chart-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font:600 9px ui-monospace,monospace;padding:1px 3px 7px;gap:8px}.legend{display:flex;gap:10px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}.range{display:flex;gap:3px}.range button{border:0;background:#edf2f7;border-radius:6px;padding:4px 7px;font:700 9px ui-monospace,monospace}.range button.active{background:var(--ink);color:white}.chart{height:350px;width:100%;display:block;touch-action:none;cursor:crosshair}.chart-tooltip{display:none;position:absolute;pointer-events:none;z-index:4;background:rgba(16,35,59,.94);color:white;border-radius:8px;padding:7px 9px;font:600 9px/1.5 ui-monospace,monospace;box-shadow:0 6px 20px rgba(0,0,0,.18)}.empty{height:350px;display:grid;place-items:center;color:var(--muted);text-align:center;padding:30px}.note{margin-top:11px;color:var(--muted);font-size:10px;line-height:1.5}.loading{padding:40px;text-align:center;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:white;padding:10px 13px;border-radius:9px;font-size:11px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}
@media(max-width:1050px){.workspace{grid-template-columns:1fr}.detail{position:static;min-height:570px;order:-1}.table-wrap{max-height:620px}.topbar{align-items:flex-start}}@media(max-width:650px){.topbar{padding:14px}.meta{display:none}.workspace{padding:9px}.detail,.panel{border-radius:14px}.detail{padding:14px}.stat-grid{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}.hide-mobile{display:none}.chart{height:285px}.command .seg{order:3;width:100%}.command .seg button{flex:1}.table-wrap{max-height:590px}.distance-cell{min-width:105px}.rail{width:42px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div class="shell">
<header class="topbar"><div class="brand"><div class="mark"></div><div><h1>Rolling VWAP Scanner</h1><div class="sub">Binance USDT spot · 7D / 30D / 90D / 365D</div></div></div><div class="feed"><span id="feedDot" class="feed-dot"></span><div id="meta" class="meta">Loading market tape…</div><button id="refresh" class="refresh">Refresh data</button></div></header>
<main class="workspace"><section class="panel scanner">
<div class="command"><input id="search" class="search" placeholder="Filter ticker…  /" aria-label="Filter ticker"><div id="periods" class="seg" aria-label="Rolling VWAP period"><button data-period="7">7D</button><button data-period="30">30D</button><button data-period="90">90D</button><button data-period="365">365D</button></div></div>
<div class="filter-row"><span class="filter-label">Position</span><div id="positions" class="seg"><button data-filter="all">All</button><button data-filter="above">Above</button><button data-filter="below">Below</button></div><span class="filter-label">History</span><select id="historyFilter" class="select"><option value="all">All</option><option value="complete">Complete only</option><option value="insufficient">Insufficient only</option></select><button id="favoriteFilter" class="favorite-filter">☆ Favorites</button><span id="count" class="count"></span></div>
<div class="table-wrap"><table><thead><tr><th data-key="symbol"><button data-sort="symbol">Market</button></th><th data-key="price"><button data-sort="price">Price</button></th><th data-key="vwap" class="hide-mobile"><button data-sort="vwap"><span id="vwapHead">365D</span> VWAP</button></th><th data-key="distance"><button data-sort="distance">Distance</button></th><th data-key="status"><button data-sort="status">Position</button></th><th data-key="history" class="hide-mobile"><button data-sort="history">History</button></th></tr></thead><tbody id="rows"><tr><td colspan="6" class="loading">Loading scanner…</td></tr></tbody></table></div>
</section><aside class="panel detail"><div id="detail"><div class="empty">Select a ticker to inspect its close against the rolling VWAP.</div></div></aside></main></div><div id="toast" class="toast"></div>
<script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
<script>
const saved=JSON.parse(localStorage.getItem('vwap-prefs')||'{}');
const state={rows:[],period:saved.period||'365',filter:saved.filter||'all',history:saved.history||'all',favorites:new Set(JSON.parse(localStorage.getItem('vwap-favorites')||'[]')),favoritesOnly:saved.favoritesOnly||false,query:'',sort:saved.sort||'distance',direction:saved.direction??-1,selected:location.hash.slice(1).toUpperCase()||null,series:[],range:saved.range||'1Y',chart:null,meta:null};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const fmt=(n,d=4)=>n==null?'—':Intl.NumberFormat('en-US',{maximumFractionDigits:d,minimumFractionDigits:Math.abs(n)<1?Math.min(d,2):0}).format(n);
const metric=r=>r.metrics?.[state.period]||{vwap:r.vwap,distance_pct:r.distance_pct,status:r.status};
function persist(){localStorage.setItem('vwap-prefs',JSON.stringify({period:state.period,filter:state.filter,history:state.history,favoritesOnly:state.favoritesOnly,sort:state.sort,direction:state.direction,range:state.range}));localStorage.setItem('vwap-favorites',JSON.stringify([...state.favorites]))}
function toast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function counts(){return state.rows.reduce((a,r)=>{const s=metric(r).status;a[s]=(a[s]||0)+1;return a},{})}
function visible(){let list=state.rows.filter(r=>{const m=metric(r);return(state.filter==='all'||m.status===state.filter)&&(state.history==='all'||(state.history==='complete'?m.distance_pct!=null:m.distance_pct==null))&&(!state.favoritesOnly||state.favorites.has(r.symbol))&&r.symbol.includes(state.query)});return list.sort((a,b)=>{let x,y;if(state.sort==='vwap'){x=metric(a).vwap;y=metric(b).vwap}else if(state.sort==='distance'){x=Math.abs(metric(a).distance_pct??-Infinity);y=Math.abs(metric(b).distance_pct??-Infinity)}else if(state.sort==='status'){x=metric(a).status;y=metric(b).status}else if(state.sort==='history'){x=a.history_days;y=b.history_days}else{x=a[state.sort];y=b[state.sort]}if(x==null&&y==null)return a.symbol.localeCompare(b.symbol);if(x==null)return 1;if(y==null)return-1;return(typeof x==='string'?x.localeCompare(y):x-y)*state.direction})}
function rail(distance){if(distance==null)return'';const pos=50+Math.max(-100,Math.min(100,distance))/2;return`<span class="rail"><i class="rail-dot" style="left:${pos}%"></i></span>`}
function renderControls(){$$('#periods button').forEach(b=>b.classList.toggle('active',b.dataset.period===state.period));$$('#positions button').forEach(b=>b.classList.toggle('active',b.dataset.filter===state.filter));$('#historyFilter').value=state.history;$('#favoriteFilter').classList.toggle('active',state.favoritesOnly);$('#favoriteFilter').textContent=state.favoritesOnly?'★ Favorites':'☆ Favorites';const labels={symbol:'Market',price:'Price',vwap:state.period+'D VWAP',distance:'Distance',status:'Position',history:'History'};$$('th').forEach(h=>h.classList.toggle('active-sort',h.dataset.key===state.sort));$$('th button').forEach(b=>{const active=b.dataset.sort===state.sort;b.textContent=labels[b.dataset.sort]+(active?(state.direction>0?' ↑':' ↓'):'')})}
function renderTable(){renderControls();const list=visible();$('#count').textContent=`${list.length} / ${state.rows.length}`;$('#rows').innerHTML=list.map(r=>{const m=metric(r),dist=m.distance_pct,complete=dist!=null;return`<tr tabindex="0" data-symbol="${r.symbol}" class="${r.symbol===state.selected?'selected':''}"><td><div class="market-cell"><button class="star ${state.favorites.has(r.symbol)?'on':''}" data-star="${r.symbol}" aria-label="Favorite ${r.symbol}">${state.favorites.has(r.symbol)?'★':'☆'}</button><span><span class="symbol">${r.symbol.replace(/USDT$/,'')}</span><span class="quote"> / USDT</span></span></div></td><td>${fmt(r.price,8)}</td><td class="hide-mobile">${fmt(m.vwap,8)}</td><td class="distance-cell ${dist==null?'':dist>=0?'positive':'negative'}"><span class="distance-row">${rail(dist)}<span>${dist==null?'—':(dist>0?'+':'')+fmt(dist,2)+'%'}</span></span></td><td><span class="badge ${m.status}">${complete?m.status:`No ${state.period}D`}</span></td><td class="hide-mobile"><span class="history">${Math.min(r.history_days||0,+state.period)} / ${state.period}d</span></td></tr>`}).join('')||'<tr><td colspan="6" class="loading">No markets match these filters. Clear filters to continue.</td></tr>';$$('tbody tr[data-symbol]').forEach(el=>{el.onclick=e=>{if(!e.target.closest('.star'))select(el.dataset.symbol)};el.onkeydown=e=>{if(e.key==='Enter')select(el.dataset.symbol)}});$$('[data-star]').forEach(b=>b.onclick=e=>{e.stopPropagation();const s=b.dataset.star;state.favorites.has(s)?state.favorites.delete(s):state.favorites.add(s);persist();renderTable()})}
function setPeriod(period){state.period=period;persist();renderTable();updateMeta();if(state.selected)renderDetail()}
function updateMeta(){if(!state.meta)return;const c=counts(),age=Date.now()-new Date(state.meta.generated_at).getTime(),stale=age>36*3600e3;$('#feedDot').className='feed-dot'+(stale?' stale':'');$('#meta').innerHTML=`${state.period}D · ${c.above||0} above · ${c.below||0} below<br>${stale?'stale · ':''}${new Date(state.meta.generated_at).toLocaleString()}`}
function getRangeCount(){return state.range==='1Y'?365:state.range==='2Y'?730:state.series.length}
function applyRange(chart,count){const length=state.series.filter(p=>p.close!=null).length,bars=Math.min(count,length);chart.timeScale().setVisibleLogicalRange({from:Math.max(0,length-bars),to:length+3})}
function createTVChart(){const container=$('#chart');if(!container||!window.LightweightCharts)return;if(state.chart){state.chart.remove();state.chart=null}const key='vwap_'+state.period,priceData=state.series.filter(p=>p.close!=null).map(p=>({time:p.time,value:p.close})),vwapData=state.series.filter(p=>p[key]!=null).map(p=>({time:p.time,value:p[key]}));if(!vwapData.length){container.innerHTML='<div class="empty">This listing does not yet have '+state.period+' completed daily observations.</div>';return}const chart=LightweightCharts.createChart(container,{autoSize:true,layout:{background:{type:LightweightCharts.ColorType.Solid,color:'#fbfdff'},textColor:'#63758b',fontFamily:'Segoe UI Variable, Segoe UI, sans-serif',attributionLogo:true},localization:{priceFormatter:value=>fmt(value,8)},grid:{vertLines:{color:'#edf2f6'},horzLines:{color:'#e2eaf1'}},rightPriceScale:{borderColor:'#d8e2ec',scaleMargins:{top:.08,bottom:.08}},timeScale:{borderColor:'#d8e2ec',rightOffset:3,timeVisible:false,secondsVisible:false},crosshair:{mode:LightweightCharts.CrosshairMode.Normal,vertLine:{color:'#7b8794',width:1,style:LightweightCharts.LineStyle.Dashed,labelBackgroundColor:'#10233b'},horzLine:{color:'#7b8794',width:1,style:LightweightCharts.LineStyle.Dashed,labelBackgroundColor:'#10233b'}},handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:false},handleScale:{axisPressedMouseMove:true,mouseWheel:true,pinch:true}});const priceSeries=chart.addSeries(LightweightCharts.LineSeries,{color:'#007f91',lineWidth:2,priceLineVisible:false,lastValueVisible:true,title:'Close'}),vwapSeries=chart.addSeries(LightweightCharts.LineSeries,{color:'#6558c7',lineWidth:3,priceLineVisible:false,lastValueVisible:true,title:state.period+'D VWAP'});priceSeries.setData(priceData);vwapSeries.setData(vwapData);const byTime=new Map(state.series.map(p=>[p.time,p]));chart.subscribeCrosshairMove(param=>{const tip=$('#chartTip');if(!tip)return;if(!param.time||!param.point||param.point.x<0||param.point.y<0||param.point.x>container.clientWidth||param.point.y>container.clientHeight){tip.style.display='none';return}const p=byTime.get(typeof param.time==='string'?param.time:`${param.time.year}-${String(param.time.month).padStart(2,'0')}-${String(param.time.day).padStart(2,'0')}`),v=p?.[key],d=v?(p.close/v-1)*100:null;if(!p){tip.style.display='none';return}tip.style.display='block';tip.style.left=Math.min(container.clientWidth-158,param.point.x+12)+'px';tip.style.top=Math.max(35,param.point.y-25)+'px';tip.innerHTML=`${p.time}<br>Close ${fmt(p.close,8)}<br>${state.period}D VWAP ${fmt(v,8)}<br>Distance ${d==null?'—':(d>0?'+':'')+fmt(d,2)+'%'}`});applyRange(chart,getRangeCount());state.chart=chart}
function renderDetail(){const r=state.rows.find(x=>x.symbol===state.selected);if(!r)return;const m=metric(r),d=m.distance_pct,cls=d==null?'':d>=0?'positive':'negative';$('#detail').innerHTML=`<div class="detail-head"><div><div class="eyebrow">Selected market · ${state.period}D</div><div class="ticker">${r.symbol.replace(/USDT$/,'')}<span class="quote"> / USDT</span></div><div class="price">${fmt(r.price,8)}</div></div><div class="distance ${cls}">${d==null?'No signal':(d>0?'+':'')+fmt(d,2)+'%'}<br><span class="badge ${m.status}">${d==null?'No '+state.period+'D':m.status}</span></div></div><div class="stat-grid"><div class="stat"><label>Latest close</label><strong>${fmt(r.price,8)}</strong></div><div class="stat"><label>${state.period}D VWAP</label><strong>${fmt(m.vwap,8)}</strong></div><div class="stat"><label>Coverage / updated</label><strong>${Math.min(r.history_days||0,+state.period)} / ${state.period}d · ${r.as_of||'—'}</strong></div></div><div class="chart-shell"><div class="chart-top"><div class="range"><button data-range="1Y">1Y</button><button data-range="2Y">2Y</button><button data-range="ALL">All</button></div><span class="legend"><span><i class="dot" style="background:#007f91"></i>Close</span><span><i class="dot" style="background:#6558c7"></i>${state.period}D VWAP</span></span></div><div id="chartTip" class="chart-tooltip"></div><div id="chart" class="chart" aria-label="Interactive close and rolling VWAP chart"></div></div><div class="note">TradingView Lightweight Charts. Hover for date and values; scroll or pinch to zoom; drag to pan. VWAP uses completed UTC daily candles.</div>`;$$('[data-range]').forEach(b=>{b.classList.toggle('active',b.dataset.range===state.range);b.onclick=()=>{state.range=b.dataset.range;persist();$$('[data-range]').forEach(x=>x.classList.toggle('active',x.dataset.range===state.range));if(state.chart)applyRange(state.chart,getRangeCount())}});requestAnimationFrame(createTVChart)}
async function select(symbol){state.selected=symbol;location.hash=symbol;renderTable();if(state.chart){state.chart.remove();state.chart=null}$('#detail').innerHTML='<div class="loading">Loading chart…</div>';try{state.series=await fetch('/api/chart/'+symbol).then(r=>{if(!r.ok)throw Error(r.statusText);return r.json()});renderDetail()}catch(e){$('#detail').innerHTML='<div class="empty">Chart unavailable: '+e.message+'</div>'}}
async function load(){const d=await fetch('/api/scanner?'+Date.now()).then(r=>{if(!r.ok)throw Error(r.statusText);return r.json()});state.rows=d.rows;state.meta=d.meta;updateMeta();renderTable();const target=state.rows.find(r=>r.symbol===state.selected)||visible()[0];if(target)select(target.symbol)}
async function refreshData(){const b=$('#refresh');b.disabled=true;b.textContent='Refreshing…';try{const res=await fetch('/api/refresh',{method:'POST'});if(!res.ok&&res.status!==409)throw Error(await res.text());toast('Refresh started');const poll=setInterval(async()=>{const s=await fetch('/api/refresh-status').then(r=>r.json());if(!s.running){clearInterval(poll);b.disabled=false;b.textContent='Refresh data';if(s.error){$('#feedDot').className='feed-dot error';toast('Refresh failed: '+s.error)}else{await load();toast('Market data refreshed')}}},1500)}catch(e){b.disabled=false;b.textContent='Refresh data';toast('Refresh failed: '+e.message)}}
$('#refresh').onclick=refreshData;$('#search').oninput=e=>{state.query=e.target.value.trim().toUpperCase();renderTable()};$$('#periods button').forEach(b=>b.onclick=()=>setPeriod(b.dataset.period));$$('#positions button').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;persist();renderTable()});$('#historyFilter').onchange=e=>{state.history=e.target.value;persist();renderTable()};$('#favoriteFilter').onclick=()=>{state.favoritesOnly=!state.favoritesOnly;persist();renderTable()};$$('th button').forEach(b=>b.onclick=()=>{const key=b.dataset.sort;if(state.sort===key)state.direction*=-1;else{state.sort=key;state.direction=key==='symbol'?1:-1}persist();renderTable()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#search').focus()}if(e.key==='Escape'){if(document.activeElement===$('#search')){$('#search').value='';state.query='';renderTable();$('#search').blur()}else{if(state.chart){state.chart.remove();state.chart=null}state.selected=null;history.replaceState(null,'',location.pathname);renderTable();$('#detail').innerHTML='<div class="empty">Select a ticker to inspect its rolling VWAP.</div>'}}if((e.key==='ArrowDown'||e.key==='ArrowUp')&&!/INPUT|SELECT/.test(document.activeElement.tagName)){e.preventDefault();const list=visible(),i=Math.max(0,list.findIndex(r=>r.symbol===state.selected)),next=list[Math.max(0,Math.min(list.length-1,i+(e.key==='ArrowDown'?1:-1)))];if(next)select(next.symbol)}});
window.addEventListener('hashchange',()=>{const s=location.hash.slice(1).toUpperCase();if(s&&s!==state.selected&&state.rows.some(r=>r.symbol===s))select(s)});
renderControls();load().catch(e=>{$('#rows').innerHTML='<tr><td colspan="6" class="loading">Data unavailable. Run python app.py --refresh.</td></tr>';$('#feedDot').className='feed-dot error';$('#meta').textContent=e.message});
</script></body></html>
